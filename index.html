<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoC Upgrade Tracker</title>
<style>
:root{--bg:#1b1410;--card:#2a1f17;--gold:#f2b632;--txt:#f5ead8;--mut:#a8977d;--ok:#6fcf63;--bad:#e5564b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 90px}
h1{font-size:20px;color:var(--gold);margin:16px 0 4px}
h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #3d2e20}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:600}.sub{font-size:12px;color:var(--mut)}
.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.done .timer{color:var(--ok)}
.bar{height:6px;background:#3d2e20;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
button{background:var(--gold);color:#1b1410;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
button.g{background:#3d2e20;color:var(--txt)}button.r{background:var(--bad);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px #0008}
input,select{width:100%;background:#1b1410;color:var(--txt);border:1px solid #3d2e20;border-radius:8px;padding:10px;font-size:15px;margin-top:4px}
label{font-size:12px;color:var(--mut);display:block;margin-top:10px}
.t3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:flex-end;z-index:5}
#modal .sheet{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
.empty{color:var(--mut);text-align:center;padding:20px}
</style></head><body>
<h1>⚔️ Upgrade Tracker</h1>
<div class="sub" id="summary"></div>
<h2>Builders</h2><div id="builders"></div>
<h2>Lab / Pets / Other</h2><div id="other"></div>
<h2>Completed</h2><div id="doneList"></div>
<div style="margin-top:20px"><button class="g" onclick="setBuilders()">Set builder count</button></div>
<button class="fab" onclick="openAdd()">+ Upgrade</button>

<div id="modal" onclick="if(event.target===this)closeM()"><div class="sheet">
<b>New upgrade</b>
<label>What (e.g. Cannon lvl 14)</label><input id="f_name">
<label>Type</label><select id="f_type" onchange="typeChg()">
<option>Building</option><option>Hero</option><option>Wall</option><option>Laboratory</option><option>Pet House</option><option>Builder Base</option></select>
<label>Builder</label><select id="f_builder"></select>
<label>Duration</label>
<div class="t3"><input id="f_d" type="number" min="0" placeholder="days"><input id="f_h" type="number" min="0" placeholder="hours"><input id="f_m" type="number" min="0" placeholder="mins"></div>
<div class="row" style="margin-top:16px"><button class="g" onclick="closeM()">Cancel</button><button onclick="addUp()">Start</button></div>
</div></div>

<script>
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
let S;try{S=JSON.parse(localStorage.getItem('coc')||'null')}catch(e){}
S=S||{builders:5,items:[],nid:1};
const save=()=>{try{localStorage.setItem('coc',JSON.stringify(S))}catch(e){}};
const OTHER=['Laboratory','Pet House'];
const fmt=ms=>{if(ms<=0)return'Done!';let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;
return(d?d+'d ':'')+(d||h?h+'h ':'')+m+'m '+(d?'':s+'s')};
function card(i,now){const left=i.end-now,done=left<=0,pct=Math.min(100,100*(now-i.start)/(i.end-i.start));
return`<div class="card ${done?'done':''}"><div class="row"><div><div class="name">${esc(i.name)}</div><div class="sub">${i.type}${i.builder?' · Builder '+i.builder:''} · ends ${new Date(i.end).toLocaleString()}</div></div><div class="timer">${fmt(left)}</div></div>
<div class="bar"><i style="width:${pct}%"></i></div>
<div class="row" style="margin-top:8px;justify-content:flex-end">${done?`<button onclick="finish(${i.id})">Collect</button>`:`<button class="g" onclick="finish(${i.id})">Finish early</button>`}<button class="r" onclick="del(${i.id})">✕</button></div></div>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){const now=Date.now();
const act=S.items.filter(i=>!i.collected);
const b=[];for(let n=1;n<=S.builders;n++){const it=act.find(i=>i.builder==n);b.push(it?card(it,now):`<div class="card"><div class="row"><span class="name">Builder ${n}</span><span class="sub" style="color:var(--ok)">Idle</span></div></div>`)}
document.getElementById('builders').innerHTML=b.join('');
const oth=act.filter(i=>!i.builder);
document.getElementById('other').innerHTML=oth.length?oth.map(i=>card(i,now)).join(''):'<div class="empty">Nothing running</div>';
const dn=S.items.filter(i=>i.collected).slice(-10).reverse();
document.getElementById('doneList').innerHTML=dn.length?dn.map(i=>`<div class="card row"><span>${esc(i.name)}</span><span class="sub">${new Date(i.end).toLocaleDateString()}</span></div>`).join(''):'<div class="empty">None yet</div>';
const idle=S.builders-act.filter(i=>i.builder).length;
document.getElementById('summary').textContent=idle+' of '+S.builders+' builders idle';}
function openAdd(){typeChg();['f_name','f_d','f_h','f_m'].forEach(k=>document.getElementById(k).value='');document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function typeChg(){const t=document.getElementById('f_type').value,sel=document.getElementById('f_builder');
if(OTHER.includes(t)){sel.innerHTML='<option value="">— none —</option>';return}
const busy=S.items.filter(i=>!i.collected&&i.builder).map(i=>i.builder);let o='';
for(let n=1;n<=S.builders;n++)o+=`<option value="${n}">Builder ${n}${busy.includes(n)?' (busy)':''}</option>`;
sel.innerHTML=o;const free=[...Array(S.builders)].map((_,k)=>k+1).find(n=>!busy.includes(n));if(free)sel.value=free}
async function addUp(){const g=k=>+document.getElementById(k).value||0;
const dur=((g('f_d')*24+g('f_h'))*60+g('f_m'))*60000;const name=document.getElementById('f_name').value.trim();
if(!name||dur<=0){alert('Enter a name and duration');return}
const type=document.getElementById('f_type').value,bv=document.getElementById('f_builder').value;
const it={id:S.nid++,name,type,builder:bv?+bv:0,start:Date.now(),end:Date.now()+dur,collected:false};
S.items.push(it);save();closeM();render();notify(it)}
async function notify(it){const n=LN();if(!n)return;try{
const p=await n.requestPermissions();if(p.display!=='granted')return;
await n.schedule({notifications:[{id:it.id,title:'Upgrade complete! 🎉',body:it.name+' is finished',schedule:{at:new Date(it.end),allowWhileIdle:true}}]})}catch(e){}}
async function cancelN(id){const n=LN();if(n)try{await n.cancel({notifications:[{id}]})}catch(e){}}
function finish(id){const i=S.items.find(x=>x.id==id);i.collected=true;i.end=Math.min(i.end,Date.now());save();cancelN(id);render()}
function del(id){if(!confirm('Remove this upgrade?'))return;S.items=S.items.filter(x=>x.id!=id);save();cancelN(id);render()}
function setBuilders(){const v=+prompt('How many builders? (1-6)',S.builders);if(v>=1&&v<=6){S.builders=v;save();render()}}
render();setInterval(render,1000);
</script></body></html>
